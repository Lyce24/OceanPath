[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oceanpath"
version = "0.1.0"
description = "MIL pretraining, benchmarking, and deployment for computational pathology"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Yancheng Liu" }]
dependencies = [
    "h5py>=3.15.1",
    "huggingface-hub>=1.4.1",
    "hydra-core>=1.3.2",
    "lightning>=2.6.1",
    "litlogger>=0.1.7",
    "numpy>=2.2.6",
    "nystrom-attention>=0.0.14",
    "omegaconf>=2.3.0",
    "onnx>=1.20.1",
    "onnxscript>=0.7.1",  # torch.onnx.export uses the dynamo exporter since torch 2.9
    "openpyxl>=3.1.5",
    "optuna>=4.7.0",
    "pandas>=2.3.3",
    "pyarrow>=23.0.1",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "timm>=0.9.16",
    "torch>=2.10.0",
    "torchmetrics>=1.8.2",
    "tqdm>=4.67.3",
    "umap-learn>=0.5.11",
    "wandb>=0.25.0",
]

[project.optional-dependencies]
# Mamba-2 aggregators (bimamba, mamba2mil, mambamil). Both packages compile CUDA
# kernels, so they need a CUDA toolkit that matches the installed torch build.
# Every import of mamba_ssm is guarded; without this extra those models are
# simply not registered.
mamba = [
    "causal-conv1d>=1.6.1",
    "mamba-ssm>=2.3.0",
]
# Patch-feature extraction from whole-slide images (stage 1).
extract = [
    "opensdpc",
    "trident",
]
# FastAPI inference server with the CPU ONNX runtime.
serve = [
    "fastapi>=0.129.0",
    "onnxruntime<1.24",
    "uvicorn[standard]>=0.40.0",
]
# The same server with the CUDA ONNX runtime. onnxruntime and onnxruntime-gpu
# install the same module, so the two extras cannot share an environment.
serve-gpu = [
    "fastapi>=0.129.0",
    "onnxruntime-gpu<1.24",
    "uvicorn[standard]>=0.40.0",
]

[tool.uv]
conflicts = [
    [{ extra = "serve" }, { extra = "serve-gpu" }],
]

# mamba-ssm and causal-conv1d compile CUDA extensions against torch, and since
# torch 2.8 neither project publishes prebuilt wheels. Build them against the
# locked runtime torch rather than whatever torch the isolated build would pick.
[tool.uv.extra-build-dependencies]
causal-conv1d = [{ requirement = "torch", match-runtime = true }]
mamba-ssm = [{ requirement = "torch", match-runtime = true }]

[tool.uv.sources]
opensdpc = { git = "https://github.com/WonderLandxD/opensdpc", rev = "a07579eedde1dffddf8fa712ef236b97ca8cfc55" }
trident = { git = "https://github.com/mahmoodlab/TRIDENT", rev = "2736579b1c5049b0051204befc17e9ae2a8fce97" }

[dependency-groups]
# Exactly what the CPU serving image installs (docker/serve.Dockerfile): the ONNX
# backend and the HTTP layer, without torch or the training stack.
serve-runtime = [
    "fastapi>=0.129.0",
    "numpy>=2.2.6",
    "onnxruntime<1.24",
    "uvicorn[standard]>=0.40.0",
]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    # Exact: each pyright release adds checks, so an upgrade is a deliberate change.
    "pyright==1.1.414",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oceanpath"]

# ═════════════════════════════════════════════════════════════════════════════
# Mypy — static type checking
# ═════════════════════════════════════════════════════════════════════════════

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false       # too strict for research code initially
check_untyped_defs = true           # but DO check bodies of untyped functions
ignore_missing_imports = true        # third-party stubs often missing
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "oceanpath.models.*"
disallow_untyped_defs = true         # strict typing for model interfaces

[[tool.mypy.overrides]]
module = "oceanpath.eval.*"
disallow_untyped_defs = true         # strict typing for evaluation

# ═════════════════════════════════════════════════════════════════════════════
# Pytest
# ═════════════════════════════════════════════════════════════════════════════

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests that take >10s (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require CUDA",
    "integration: marks tests that need external resources (memmap, models)",
]
filterwarnings = [
    "ignore::UserWarning:umap",
    "ignore::DeprecationWarning",
]

# ═════════════════════════════════════════════════════════════════════════════
# Coverage
# ═════════════════════════════════════════════════════════════════════════════

[tool.coverage.run]
source = ["src/oceanpath"]
omit = [
    "*/__init__.py",
]
# The DDP tests fork gloo ranks (tests/test_ssl_distributed.py); measure inside them too.
concurrency = ["multiprocessing", "thread"]
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ ==",
    "raise NotImplementedError",
]
show_missing = true
skip_empty = true

[tool.setuptools.packages.find]
where = ["src"]

# ═════════════════════════════════════════════════════════════════════════════
# Ruff — lint and format
# ═════════════════════════════════════════════════════════════════════════════

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM108"]  # if/else blocks here usually carry a comment per branch

# ═════════════════════════════════════════════════════════════════════════════
# Pyright — static type checking (`make typecheck`, run in CI)
# ═════════════════════════════════════════════════════════════════════════════

[tool.pyright]
include = ["src/oceanpath"]
# The oldest supported Python, on the platform training and serving run on.
pythonVersion = "3.10"
pythonPlatform = "Linux"
# Standard mode plus the strict rules below, which hold today. Strict mode holds for no
# subpackage: its unknown-type and missing-annotation rules flag every value that comes
# from torch, pandas, scikit-learn or h5py, which are only partly annotated (over 5,000
# reports; even the small training package trips on torch.distributed's signatures).
# Other strict rules stay off for good reasons: the unnecessary isinstance and comparison
# rules report the runtime checks that guard configs, files and checkpoints, where
# annotations are not enforced; the private-usage rule would flag the underscored helpers
# that sibling modules share on purpose; the constant-redefinition rule would flag the
# reassigned upper-case maths names (Z, A, C, D). Unused imports and variables are ruff's.
typeCheckingMode = "standard"
reportDeprecated = "error"
reportMatchNotExhaustive = "error"
reportUnnecessaryCast = "error"
# An ignore that no longer suppresses anything is reported, so ignores cannot go stale.
# A warning rather than an error: the mamba extra's three imports carry an ignore that
# only an environment without the extra (CI) needs, so where the extra is installed
# they show up here; any other warning is a stale ignore, and CI (pyright --warnings)
# fails on it.
reportUnnecessaryTypeIgnoreComment = "warning"
reportUnusedClass = "error"
reportUnusedFunction = "error"
